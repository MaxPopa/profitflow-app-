# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "your_client_id_here"
name = "profitflow"
handle = "profitflow-app"
application_url = "https://profitflow-app.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,read_products"

[auth]
redirect_urls = [
  "https://profitflow-app.onrender.com/auth/callback",
  "https://profitflow-app.onrender.com/auth/shopify/callback",
  "https://profitflow-app.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2024-04"

[pos]
embedded = false
