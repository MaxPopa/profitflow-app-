name = "ProfitFlow"
handle = "profitflow"
client_id = ""
application_url = "https://profitflow-mt6a.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "profitflow-test-store.myshopify.com"

[access_scopes]
# Permisiunile obligatorii pentru citirea comenzilor și produselor din Shopify
scopes = "read_orders, write_orders, read_products"

[auth]
redirect_urls = [
  "https://profitflow-mt6a.onrender.com/auth/callback",
  "https://profitflow-mt6a.onrender.com/auth/shopify/callback",
  "https://profitflow-mt6a.onrender.com/api/auth/callback"
]

[api]
api_version = "2024-10"
